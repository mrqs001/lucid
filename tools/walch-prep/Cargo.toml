[package]
name = "walch-prep"
version = "0.1.0"
edition = "2024"
description = "Turns the Walch et al. sleep-accel dataset into Lucid replay inputs (1 Hz HR, 1 s motion summaries, PSG labels)"
license = "MIT"

[dependencies]
anyhow = "1"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
